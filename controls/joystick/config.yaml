# Joystick Controller Configuration

joystick:
  device_index: 0

serial:
  port: "/dev/ttyUSB0"  # Serial port for ESP32 communication
  baudrate: 115200
  timeout: 0.1
  send_rate_hz: 30

axes:
  - name: "rutter"
    axis_index: 0
    device_type: "servo"
    deadzone: 0.05
    invert: false
    output_min: -45
    output_max: 45
    target_servo_id: 1
    epsilon: 2 
    move_time_ms: 1
  
  - name: "thruster"
    axis_index: 2  # Y-axis (typically throttle)
    device_type: "motor"
    deadzone: 0.1
    invert: false
    output_min: -100  # Full reverse
    output_max: 100   # Full forward
    target_motor_id: 10  # ESC Motor ID from ESP32 config
    epsilon: 5  # Don't send unless change is at least 5%

buttons:
  - name: "toggle_light"
    button_index: 3  # Assuming L3 is button index 9
    command: "TOGGLE_LIGHT"
