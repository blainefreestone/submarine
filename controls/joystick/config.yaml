# Joystick Controller Configuration

joystick:
  device_index: 0

serial:
  port: "socket://192.168.1.1:3001"  # Serial port for ESP32 communication
  baudrate: 115200
  timeout: 1
  send_rate_hz: 30

axes:
  # 4-Thruster Drive & Steering Axes
  - name: "surge"
    axis_index: 1  # Left stick vertical (Forward / Reverse)
    device_type: "motor_group"
    deadzone: 0.1
    invert: false
    output_min: -100
    output_max: 100
    epsilon: 5

  - name: "sway"
    axis_index: 0  # Left stick horizontal (Strafe Left / Right)
    device_type: "motor_group"
    deadzone: 0.1
    invert: false
    output_min: -100
    output_max: 100
    epsilon: 5

  - name: "yaw"
    axis_index: 2  # Right stick horizontal (Turning / Steering)
    device_type: "motor_group"
    deadzone: 0.1
    invert: false
    output_min: -100
    output_max: 100
    epsilon: 5

  - name: "heave"
    axis_index: 3  # Right stick vertical (Up / Down)
    device_type: "motor_group"
    deadzone: 0.1
    invert: false
    output_min: -100
    output_max: 100
    epsilon: 5

  # Ballast Pump Axis
  - name: "pump"
    axis_index: 4 
    device_type: "pump"
    deadzone: 0.1
    invert: false
    output_min: -100  # Full reverse (Empty)
    output_max: 100   # Full forward (Fill)

buttons:
  - name: "toggle_light"
    button_index: 3  # L3 on joystick
    command: "TOGGLE_LIGHT"

  - name: "read_pressure"
    button_index: 1  # L1 on joystick
    command: "PRESSURE"

  - name: "solenoid_override"
    button_index: 7  # Unbound button for manual solenoid override
    command: "SOLENOID_OVERRIDE"